services:
  - type: web
    name: flamecare-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SERVICE_URL
        sync: false
      - key: KEEP_ALIVE_ENABLED
        value: true
      - key: FLASK_ENV
        value: production
    healthCheckPath: /health
